version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: noon_mysql_db
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: noon_crm
      MYSQL_USER: noon_admin
      MYSQL_PASSWORD: noon_secure_pass
      MYSQL_ROOT_PASSWORD: noon_root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: noon_backend_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: noon_crm
      MYSQL_USER: noon_admin
      MYSQL_PASSWORD: noon_secure_pass
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: noon_frontend_ui
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mysql_data:
